[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replicateshift"
version = "0.2.0"
description = "Repeat-aware deep learning, conformal prediction, and measurement-allocation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
authors = [{name = "Chen Yang"}]

[project.scripts]
replicateshift = "replicateshift.toolkit:main"
replicateshift-allocation = "replicateshift.allocation:main"
replicateshift-benchmark = "replicateshift.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
