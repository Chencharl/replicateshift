name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m replicateshift.benchmark --specimens 120 --seeds 7 --epochs 5 --output results/local-ci
      - run: replicateshift fit examples/synthetic_assay.csv --output results/local-ci-model --epochs 5
      - run: replicateshift predict --input examples/new_specimens.csv --model results/local-ci-model --output results/local-ci-predictions.csv
